<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Drone-Invasion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; position: relative; }
    canvas { display: block; background: #000; }
   /* Dentro il tuo <style> */
 .overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start; /* inizia dall’alto, non centrare verticalmente */
  background: rgba(0,0,0,0.8);
  color: #fff;
  font-family: sans-serif;
  z-index: 10;

  /* consente lo scroll se il contenuto è più alto di 100% */
  overflow-y: auto;
}

#scoreList {
  width: 80%;         /* o la larghezza che preferisci */
  max-height: 50vh;   /* occupa fino al 50% dell’altezza viewport */
  margin-top: 1rem;   /* separa dal titolo */
  overflow-y: auto;   /* abilita la scrollbar interna */
  padding-right: 10px;/* spazio per la scrollbar */
  text-align: center;
}

    button { padding: 10px 20px; margin: 10px; font-size: 18px; cursor: pointer;
      border: none; border-radius: 5px; background: #28a; color: #fff; }
    ul { list-style: none; margin-top: 10px; padding: 0; }
    ul li { margin: 5px 0; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="startScreen" class="overlay">
    <h1>Drone-Invasion</h1>
    <button id="playBtn">Gioca</button>
    <h2>Ultimi punteggi</h2>
    <ul id="scoreList"></ul>
  </div>
  <div id="gameOverScreen" class="overlay" style="display:none;">
    <h1>GAME OVER</h1>
    <p id="finalScore"></p>
    <button id="retryBtn">Riprova</button>
  </div>
<script>
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  let W = canvas.width = innerWidth, H = canvas.height = innerHeight;
  window.addEventListener('resize', () => { W = canvas.width = innerWidth; H = canvas.height = innerHeight; });

  const startScreen    = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const playBtn        = document.getElementById('playBtn');
  const retryBtn       = document.getElementById('retryBtn');
  const scoreList      = document.getElementById('scoreList');
  const finalScore     = document.getElementById('finalScore');

  const minBubbleSize = 40, maxBubbleSize = 60;
  const baseSpeed     = 2, accelRate = 0.00005;
  const enemyFreq     = 1000;
  const heavyFrameDuration = 200; // ms tra un frame e l'altro

  // Background
  const bgImg = new Image(); bgImg.src = 'immagini/sfondo1.11.jpeg';

  // Player animation
  const playerFrames = [], totalPlayerFrames = 2;
  for (let i = 1; i <= totalPlayerFrames; i++) {
    const img = new Image(); img.src = `immagini/mod${i}.PNG`;
    playerFrames.push(img);
  }
  let currentPlayerFrame = 0, lastPlayerFrameTime = Date.now();
  const playerFrameDuration = 100;
  function updatePlayerAnimation() {
    const now = Date.now();
    if (now - lastPlayerFrameTime >= playerFrameDuration) {
      currentPlayerFrame = (currentPlayerFrame + 1) % playerFrames.length;
      lastPlayerFrameTime = now;
    }
  }
  function drawPlayer(x,y,w,h) {
    updatePlayerAnimation();
    const img = playerFrames[currentPlayerFrame];
    if (img.complete) ctx.drawImage(img, x, y, w, h);
  }

  // Explosion animation
  const explosionFrames = [], totalExplosionFrames = 3;
  for (let i = 1; i <= totalExplosionFrames; i++) {
    const img = new Image(); img.src = `immagini/explosion${i}.png`;
    explosionFrames.push(img);
  }
  let explosions = [];
  function startExplosion(x,y) { explosions.push({ x, y, start: Date.now(), frame: 0 }); }

  // Ground enemies
  const groundFrames = [];
  for (let i = 1; i <= 3; i++) {
    const img = new Image(); img.src = `immagini/bubble${i}.PNG`;
    groundFrames.push(img);
  }
  let currentGroundFrame = 0, lastGroundFrameTime = Date.now();
  const groundFrameDuration = 150;
  function updateGroundAnimation() {
    const now = Date.now();
    if (now - lastGroundFrameTime >= groundFrameDuration) {
      currentGroundFrame = (currentGroundFrame + 1) % groundFrames.length;
      lastGroundFrameTime = now;
    }
  }
  function drawGround(x,y,w,h) {
    const img = groundFrames[currentGroundFrame];
    if (img.complete) ctx.drawImage(img, x, y, w, h);
  }

  // Flying enemies
  const flyingFrames = [], totalFlyingFrames = 2;
  for (let i = 1; i <= totalFlyingFrames; i++) {
    const img = new Image(); img.src = `immagini/drone${i}.PNG`;
    flyingFrames.push(img);
  }
  let currentFlyingFrame = 0, lastFlyingFrameTime = Date.now();
  const flyingFrameDuration = 200;
  function updateFlyingAnimation() {
    const now = Date.now();
    if (now - lastFlyingFrameTime >= flyingFrameDuration) {
      currentFlyingFrame = (currentFlyingFrame + 1) % flyingFrames.length;
      lastFlyingFrameTime = now;
    }
  }
  function drawFlying(x,y,w,h) {
    updateFlyingAnimation();
    const img = flyingFrames[currentFlyingFrame];
    if (img.complete) ctx.drawImage(img, x, y, w, h);
  }

  // Heavy Enemy (animated)
  const heavyImgs = [];
  ['heavy1.PNG','heavy2.PNG','heavy3.PNG'].forEach(src => {
    const img = new Image(); img.src = `immagini/${src}`;
    heavyImgs.push(img);
  });
  let heavyEnemies = [];
  function spawnHeavy() {
    const size = 80;
    heavyEnemies.push({ x: W, y: H - size - 20, w: size, h: size,
      baseSpeed: 5, health: 5, maxHealth: 5, frameIndex: 0, lastFrameTime: Date.now() });
  }
  function updateHeavyAnimation(e) {
    const now = Date.now();
    if (now - e.lastFrameTime >= heavyFrameDuration) {
      e.frameIndex = (e.frameIndex + 1) % heavyImgs.length;
      e.lastFrameTime = now;
    }
  }

  // NEW: Heavy2 Enemy (più grosso, spawn ogni 12s)
const heavy2Imgs = [];
['heavy2_1.PNG','heavy2_2.PNG'].forEach(src => {
  const img = new Image();
  img.src = `immagini/${src}`;
  heavy2Imgs.push(img);
});
let heavy2Enemies = [];
function spawnHeavy2() {
  const size = 70;
  heavy2Enemies.push({
    x: W, y: H - size - 20,
    w: size, h: size,
    baseSpeed: 4,
    health: 8, maxHealth: 8,
    frameIndex: 0,
    lastFrameTime: Date.now()
  });
}
function updateHeavy2Animation(e) {
  const now = Date.now();
  if (now - e.lastFrameTime >= heavyFrameDuration) {
    e.frameIndex = (e.frameIndex + 1) % heavy2Imgs.length;
    e.lastFrameTime = now;
  }
}

// NEW: Flying Armored Enemy (spara più veloce)
// 1) Frame dei droni
const armFlyingFrames = [];
for (let i = 1; i <= 2; i++) {
  const img = new Image();
  img.src = `immagini/armdrone${i}.PNG`;
  armFlyingFrames.push(img);
}

// 2) Array dei nemici
let armFlyingEnemies = [];

// 3) Spawn degli Armored Flying
function spawnArmFlying() {
  const size = 40;
  const yPos = 50 + Math.random() * (H / 3);
  armFlyingEnemies.push({
    x: W,
    y: yPos,
    w: size,
    h: size,
    baseSpeed: 1 + Math.random() * 0.5,  // range 1–1.5 (molto più lento)
    shootTimer: 0,
    frameIndex: 0,
    lastFrameTime: Date.now()
  });
}

// 4) Animazione del drone
function updateArmFlyingAnimation(e) {
  const now = Date.now();
  if (now - e.lastFrameTime >= flyingFrameDuration) {
    e.frameIndex = (e.frameIndex + 1) % armFlyingFrames.length;
    e.lastFrameTime = now;
  }
}

// 6) Mantieni il tuo blocco di gestione enemyBullets così come è (gravità, rimbalzi, collisioni, rimozione)


// Boss che rimbalza
let boss = null;
let bossSpawned = false;
const bossFrames = [];
['boss1.PNG', 'boss2.PNG','boss3.PNG'].forEach(src => {
  const img = new Image();
  img.src = `immagini/${src}`;
  bossFrames.push(img);
});


  // Audio ... // resta identico
  const shootSnd = new Audio('audio/sparo2.mp3'),
        enemyHitSnd = new Audio('audio/esplosione2.mp3'),
        flyingHitSnd = new Audio('audio/arma-scarica.mp3'),
        playerHitSnd = new Audio('audio/lagnasorridente.mp3'),
        bgMusic = new Audio('audio/sottofondofree.mp3');
  bgMusic.loop = true; shootSnd.volume = 0.2; enemyHitSnd.volume = 0.2;
  flyingHitSnd.volume = 0.3; playerHitSnd.volume = 0.6; bgMusic.volume = 0.04;
  function playShoot(){ shootSnd.currentTime=0; shootSnd.play(); }

  // Game state
  let player, groundEnemies, flyingEnemies, enemyBullets;
  let elapsedTime, gameSpeed, bgX, score, killCount, gameOver, playing, lastTime;
  let spawnGroundInt, spawnFlyingInt, spawnHeavyInt, spawnHeavy2Int, spawnArmFlyInt;


  

let spawnBossTimeout = null;




  function initGame() {
    elapsedTime = 0; bgX = 0; score = 0; killCount = 0;
    gameOver = false; playing = true; gameSpeed = baseSpeed;
player = {
  x: W * 0.1,
  y: H - 80,
  w: 70,
  h: 70,
  vy: 0,
  gravity: 0.6,
  jumpStrength: -15,
  canJump: true,
  bullets: [],
  energy: 100,
  maxEnergy: 100,
  bulletSpeed: 10,

  // Per gestire l’invincibilità dopo il colpo:
  lastHitTime: 0,       // timestamp dell’ultimo danno subito
  hitCooldown: 500      // durata dell’invincibilità in ms
};

    groundEnemies = []; flyingEnemies = []; armFlyingEnemies = [];
    enemyBullets = []; heavyEnemies = []; heavy2Enemies = []; explosions = [];

  // reset del boss
  if (spawnBossTimeout) {
    clearTimeout(spawnBossTimeout);
    spawnBossTimeout = null;
  }
  boss = null;
  bossSpawned = false;

  // riprogramma lo spawn del boss
  spawnBossTimeout = setTimeout(() => {
    if (playing && !bossSpawned) {
      spawnBoss();
      bossSpawned = true;
    }
  }, 20000);




    lastTime = performance.now();
    clearInterval(spawnGroundInt); 
    clearInterval(spawnFlyingInt); 
    clearInterval(spawnHeavyInt);
    clearInterval(spawnHeavy2Int);
    clearInterval(spawnArmFlyInt);

    spawnGroundInt  = setInterval(spawnGround, enemyFreq);
    spawnFlyingInt  = setInterval(spawnFlying, 5000);
    spawnHeavyInt   = setInterval(spawnHeavy, 10000);
    spawnHeavy2Int  = setInterval(spawnHeavy2, 12000);      // Heavy2 ogni 12s
    spawnArmFlyInt  = setInterval(spawnArmFlying, 9000);    // Armored Drone ogni 9s


    bgMusic.currentTime = 0; bgMusic.play(); loadScores();
    
  }
  

  function spawnGround(){ if(!playing) return; const size=minBubbleSize+Math.random()*(maxBubbleSize-minBubbleSize); groundEnemies.push({ x:W, y:H-size-20, w:size, h:size, baseSpeed:2+Math.random()*2 }); }
  function spawnFlying(){ if(!playing) return; const size=30+Math.random()*20, yPos=50+Math.random()*(H/3); flyingEnemies.push({ x:W, y:yPos, w:size, h:size, baseSpeed:1+Math.random()*2, shootTimer:0 }); }
  function spawnBoss() {
  const size = 120;
  boss = {
    x: W/2, y: H/2,
    w: size, h: size,
    vx: 4, vy: 3.5,
    health: 20, maxHealth: 20,
    frameIndex: 0,
    lastFrameTime: Date.now()
  };
}



  
  playBtn.onclick = ()=>{ startScreen.style.display='none'; initGame(); };
retryBtn.onclick = () => {gameOverScreen.style.display = 'none';initGame();}



  window.addEventListener('touchstart', e=>{
    if(!playing) return;
    const t = e.changedTouches[0];
    if(t.clientY < H/3) { player.bullets.push({ x:player.x+player.w/2, y:player.y, r:5, vx:0, vy:-player.bulletSpeed }); playShoot(); }
    else if(t.clientX < W/2 && player.canJump) { player.vy=player.jumpStrength; player.canJump=false; }
    else { player.bullets.push({ x:player.x+player.w, y:player.y+player.h/2, r:5, vx:player.bulletSpeed, vy:0 }); playShoot(); }
  });

  function endGame(){ playing=false; clearInterval(spawnGroundInt); clearInterval(spawnFlyingInt); clearInterval(spawnHeavyInt); bgMusic.pause(); finalScore.textContent=`Punteggio finale: ${score}`; gameOverScreen.style.display='flex'; const name=prompt('Game Over! Inserisci il tuo nome:')||'Anonimo'; const sc=JSON.parse(localStorage.getItem('scores')||'[]'); sc.push({name,score}); localStorage.setItem('scores',JSON.stringify(sc)); loadScores(); }
  function loadScores() {
  const sc = JSON.parse(localStorage.getItem('scores') || '[]');
  scoreList.innerHTML = '';

  // 1) ordina dal punteggio più alto al più basso
  sc.sort((a, b) => b.score - a.score);

  // 2) prendi i primi 5 (i migliori)
  sc.slice(0, 5).forEach(s => {
    const li = document.createElement('li');
    li.textContent = `${s.name}: ${s.score}`;
    scoreList.append(li);
  });
}


  function update(dt){
  // Gravità e salto
  player.vy += player.gravity;
  player.y  += player.vy;
  if(player.y + player.h >= H - 20){
    player.y        = H - player.h - 20;
    player.vy       = 0;
    player.canJump  = true;
  }

  // Movimento proiettili giocatore
  player.bullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
  player.bullets = player.bullets.filter(b => b.x > 0 && b.x < W && b.y > 0 && b.y < H);

  // Aggiorna Heavy2 nemici
for (let i = heavy2Enemies.length - 1; i >= 0; i--) {
  const e = heavy2Enemies[i];
  e.x -= e.baseSpeed * gameSpeed;
  updateHeavy2Animation(e);
  if (e.x + e.w < 0) {
    heavy2Enemies.splice(i, 1);
  }
}



// Aggiorna Armored Flying nemici
for (let i = armFlyingEnemies.length - 1; i >= 0; i--) {
  const e = armFlyingEnemies[i];
  e.x -= e.baseSpeed * gameSpeed;
  updateArmFlyingAnimation(e);
  if (e.x + e.w < 0) {
    armFlyingEnemies.splice(i, 1);
  }
}


/*   enemyBullets (volo + atterraggio) */
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];

    if (!b.grounded && b.bounce) {
      // gravità + spostamento
      b.vy += b.gravity;
      b.x  += b.vx;
      b.y  += b.vy;

      // primo impatto col suolo: fermalo qui
      if (b.y + b.r >= H - 20) {
        b.y        = H - 20 - b.r;
        b.vx       = 0;
        b.vy       = 0;
        b.bounce   = false;
        b.grounded = true;
      }
    }
    // se b.grounded || !b.bounce → rimane fermo

    // Collisione in volo (opzionale, se vuoi ancora danno in volo)
    if (!b.grounded &&
        b.x > player.x &&
        b.x < player.x + player.w &&
        b.y > player.y &&
        b.y < player.y + player.h
    ) {
      enemyBullets.splice(i,1);
      player.energy -= 10;
      playerHitSnd.currentTime = 0;
      playerHitSnd.play();
      if (player.energy <= 0) endGame();
      continue;
    }

   
  }


  // Collisioni proiettile → flyingEnemies / groundEnemies
  for(let i = player.bullets.length - 1; i >= 0; i--){
    const b = player.bullets[i];
    let hit = false;
    // Volanti normali
    for(let j = flyingEnemies.length - 1; j >= 0; j--){
      const e = flyingEnemies[j];
      if(b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h){
        player.bullets.splice(i,1);
        flyingEnemies.splice(j,1);
        startExplosion(e.x,e.y);
        score += 20;
        enemyHitSnd.currentTime = 0; enemyHitSnd.play();
        hit = true; break;
      }
    }
    if(hit) continue;
    // A terra
    for(let k = groundEnemies.length - 1; k >= 0; k--){
      const o = groundEnemies[k];
      if(b.x > o.x && b.x < o.x + o.w && b.y > o.y && b.y < o.y + o.h){
        player.bullets.splice(i,1);
        groundEnemies.splice(k,1);
        startExplosion(o.x,o.y);
        score += 10;
        enemyHitSnd.currentTime = 0; enemyHitSnd.play();
        break;
      }
    }
  }

  // Collisioni proiettile → heavyEnemies
  for(let i = heavyEnemies.length - 1; i >= 0; i--){
    const e = heavyEnemies[i];
    for(let j = player.bullets.length - 1; j >= 0; j--){
      const b = player.bullets[j];
      if(b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h){
        player.bullets.splice(j,1);
        e.health--;
        if(e.health <= 0){
          heavyEnemies.splice(i,1);
          startExplosion(e.x,e.y);
          score += 50;
        }
        enemyHitSnd.currentTime = 0; enemyHitSnd.play();
        break;
      }
    }
  }

  // Collisioni proiettile → heavy2Enemies
  for(let i = heavy2Enemies.length - 1; i >= 0; i--){
    const e = heavy2Enemies[i];
    for(let j = player.bullets.length - 1; j >= 0; j--){
      const b = player.bullets[j];
      if(b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h){
        player.bullets.splice(j,1);
        e.health--;
        if(e.health <= 0){
          heavy2Enemies.splice(i,1);
          startExplosion(e.x,e.y);
          score += 80;
        }
        enemyHitSnd.currentTime = 0; enemyHitSnd.play();
        break;
      }
    }
  }


 

  

  // Pulisci esplosioni in corso
  const now = Date.now();
  explosions = explosions.filter(ex => {
    const elapsed = now - ex.start;
    const idx     = Math.floor(elapsed / (heavyFrameDuration / totalExplosionFrames));
    if(idx < totalExplosionFrames){
      ex.frame = idx;
      return true;
    }
    return false;
  });

 enemyBullets.forEach((b, idx) => {
    if (b.grounded) {
      if (
        player.x <  b.x + b.r &&
        player.x + player.w > b.x - b.r &&
        player.y <  b.y + b.r &&
        player.y + player.h > b.y - b.r
      ) {
        player.energy -= 20;
        playerHitSnd.currentTime = 0;
        playerHitSnd.play();
        // se vuoi far sparire la “trappola” dopo il danno:
        // enemyBullets.splice(idx, 1);
      }
    }
  });
  

  // Movimento groundEnemies
  groundEnemies.forEach(e => e.x -= e.baseSpeed + elapsedTime * accelRate);
  groundEnemies = groundEnemies.filter(e => e.x + e.w > 0);

  // Movimento flyingEnemies
  flyingEnemies.forEach(e => {
    e.x        -= e.baseSpeed;
    e.shootTimer += dt;
    if(e.shootTimer > 1000){  // ← QUI: intervallo di sparo in ms
      enemyBullets.push({ x: e.x + e.w/2, y: e.y + e.h, vy: 6  }); // vy: 6 ← QUI: velocità verticale del proiettile
      e.shootTimer = 0;
    }
  });
  flyingEnemies = flyingEnemies.filter(e => e.x + e.w > 0);

  // Movimento heavyEnemies
  heavyEnemies.forEach(e => {
    e.x -= e.baseSpeed + elapsedTime * accelRate;
    updateHeavyAnimation(e);
  });
  heavyEnemies = heavyEnemies.filter(e => e.x + e.w > 0);

  // Movimento heavy2Enemies
  heavy2Enemies.forEach(e => {
    e.x -= e.baseSpeed + elapsedTime * accelRate;
    updateHeavy2Animation(e);
  });
  heavy2Enemies = heavy2Enemies.filter(e => e.x + e.w > 0);

  // Movimento armFlyingEnemies
  armFlyingEnemies.forEach(e => {
    e.x          -= e.baseSpeed;
    e.shootTimer += dt;
 if (e.shootTimer > 1000) {
  enemyBullets.push({
    x: e.x + e.w/2,
    y: e.y + e.h,
    vx: 0,           // orizzontale zero
    vy: 6,           // velocità iniziale verso il basso
    bounce: true,    // flag per il rimbalzo
    gravity: 0.3,    // gravità
    damping: 0.7     // smorzamento al rimbalzo
  });
  e.shootTimer = 0;
}


    updateArmFlyingAnimation(e);
  });
  armFlyingEnemies = armFlyingEnemies.filter(e => e.x + e.w > 0);
for (let i = enemyBullets.length - 1; i >= 0; i--) {
  const b = enemyBullets[i];

  // 1) Movimento: bounce-enabled vs. lineare
  if (b.bounce) {
    // gravità
    b.vy += b.gravity;
    // spostamento
    b.x += (b.vx || 0);
    b.y += b.vy;

    // rimbalzo sul pavimento (H - 20), offset raggio 4
    if (b.y + 4 >= H - 20) {
      b.y  = H - 20 - 4;
      b.vy = -b.vy * b.damping;
      // se troppo lento, lo eliminiamo
      if (Math.abs(b.vy) < 1) {
        enemyBullets.splice(i, 1);
        continue;
      }
    }
  } else {
    // vecchio comportamento lineare
    b.x += (b.vx || 0);
    b.y += b.vy;
  }

  // 2) Collisione con il player
  if (
    b.x > player.x &&
    b.x < player.x + player.w &&
    b.y > player.y &&
    b.y < player.y + player.h
  ) {
    enemyBullets.splice(i, 1);
    player.energy -= 10;
    playerHitSnd.currentTime = 0;
    playerHitSnd.play();
    if (player.energy <= 0) endGame();
    continue;  // passa al proiettile successivo
  }

  // 3) Rimuovi i proiettili fuori schermo
  if (b.x < 0 || b.x > W || b.y < 0 || b.y > H + 50) {
    enemyBullets.splice(i, 1);
  }
}


  // Collisioni giocatore → groundEnemies
  groundEnemies.forEach((o,i) => {
    if(o.x < player.x + player.w && o.x + o.w > player.x && o.y < player.y + player.h && o.y + o.h > player.y){
      groundEnemies.splice(i,1);
      player.energy -= 20;
      playerHitSnd.currentTime = 0; playerHitSnd.play();
      if(player.energy <= 0) endGame();
    }
  });

  // Collisioni giocatore → flyingEnemies
  flyingEnemies.forEach((e,i) => {
    if(e.x < player.x + player.w && e.x + e.w > player.x && e.y < player.y + player.h && e.y + e.h > player.y){
      flyingEnemies.splice(i,1);
      player.energy -= 20;
      playerHitSnd.currentTime = 0; playerHitSnd.play();
      if(player.energy <= 0) endGame();
    }
  });

  // Collisioni giocatore → heavyEnemies
  heavyEnemies.forEach((e,i) => {
    if(e.x < player.x + player.w && e.x + e.w > player.x && e.y < player.y + player.h && e.y + e.h > player.y){
      heavyEnemies.splice(i,1);
      player.energy -= 30;
      playerHitSnd.currentTime = 0; playerHitSnd.play();
      if(player.energy <= 0) endGame();
    }
  });

  // Collisioni giocatore → heavy2Enemies
  heavy2Enemies.forEach((e,i) => {
    if(e.x < player.x + player.w && e.x + e.w > player.x && e.y < player.y + player.h && e.y + e.h > player.y){
      heavy2Enemies.splice(i,1);
      player.energy -= 40;
      playerHitSnd.currentTime = 0; playerHitSnd.play();
      if(player.energy <= 0) endGame();
    }
  });

  // Collisioni giocatore → armFlyingEnemies
  armFlyingEnemies.forEach((e,i) => {
    if(e.x < player.x + player.w && e.x + e.w > player.x && e.y < player.y + player.h && e.y + e.h > player.y){
      armFlyingEnemies.splice(i,1);
      player.energy -= 25;
      playerHitSnd.currentTime = 0; playerHitSnd.play();
      if(player.energy <= 0) endGame();
    }
  });
if (boss) {
  // 1) Movimento + rimbalzo contro i bordi
  boss.x += boss.vx;
  boss.y += boss.vy;
  if (boss.x <= 0 || boss.x + boss.w >= W) boss.vx *= -1;
  if (boss.y <= 0 || boss.y + boss.h >= H) boss.vy *= -1;

  // 1bis) Aggiorna animazione
  const now = Date.now();
  if (now - boss.lastFrameTime >= 150) {
    boss.frameIndex = (boss.frameIndex + 1) % bossFrames.length;
    boss.lastFrameTime = now;
  }

  // 2) Collisione diretta player ↔ boss: sottrae energia con cooldown
  if (
    player.x < boss.x + boss.w &&
    player.x + player.w > boss.x &&
    player.y < boss.y + boss.h &&
    player.y + player.h > boss.y
  ) {
    // verifica gli i-frames
    if (now - player.lastHitTime >= player.hitCooldown) {
      player.lastHitTime = now;
      player.energy -= 15;            // danno ridotto
      playerHitSnd.currentTime = 0;
      playerHitSnd.play();
      if (player.energy <= 0) endGame();
    }
  }

  // 3) Collisione proiettile → boss + rimbalzo
  for (let i = player.bullets.length - 1; i >= 0; i--) {
    const b = player.bullets[i];
    if (
      b.x > boss.x && b.x < boss.x + boss.w &&
      b.y > boss.y && b.y < boss.y + boss.h
    ) {
      // a) rimuovo proiettile e applico danno
      player.bullets.splice(i, 1);
      boss.health--;
      enemyHitSnd.currentTime = 0;
      enemyHitSnd.play();

      // b) calcolo impulso di rimbalzo
      const dx = (boss.x + boss.w/2) - b.x;
      const dy = (boss.y + boss.h/2) - b.y;
      const mag = Math.hypot(dx, dy) || 1;
      const force = 5;
      boss.vx += (dx / mag) * force;
      boss.vy += (dy / mag) * force;

      // c) se il boss muore…
      if (boss.health <= 0) {
        startExplosion(boss.x, boss.y);
        boss = null;
        score += 200;
        setTimeout(() => { if (playing) spawnBoss(); }, 10000);
      }
      break;
    }
  }
}



}

    function draw(){ bgX=(bgX-gameSpeed)%W; ctx.drawImage(bgImg,bgX,0,W,H); ctx.drawImage(bgImg,bgX+W,0,W,H);
    if(!player) return;
    const lifeRatio=player.energy/player.maxEnergy; const barW=200,barH=20;
    const red=Math.floor((1-lifeRatio)*255), green=Math.floor(lifeRatio*255);
    ctx.fillStyle=`rgb(${red},${green},0)`; ctx.fillRect(20,20,barW*lifeRatio,barH);
    ctx.strokeStyle='#fff'; ctx.strokeRect(20,20,barW,barH);
    drawPlayer(player.x,player.y,player.w,player.h);
    updateGroundAnimation(); groundEnemies.forEach(e=>drawGround(e.x,e.y,e.w,e.h));
    flyingEnemies.forEach(e=>drawFlying(e.x,e.y,e.w,e.h));
    heavyEnemies.forEach(e=>{ const img=heavyImgs[e.frameIndex]; if(img.complete) ctx.drawImage(img,e.x,e.y,e.w,e.h); ctx.fillStyle='red'; ctx.fillRect(e.x,e.y-10,e.w*(e.health/e.maxHealth),5); ctx.strokeStyle='#fff'; ctx.strokeRect(e.x,e.y-10,e.w,5); });
    // Disegna Heavy2 nemici
for (const e of heavy2Enemies) {
  ctx.drawImage(heavy2Imgs[e.frameIndex], e.x, e.y, e.w, e.h);
}

// Disegna Armored Flying nemici
for (const e of armFlyingEnemies) {
  ctx.drawImage(armFlyingFrames[e.frameIndex], e.x, e.y, e.w, e.h);
}
if (boss) {
  const img = bossFrames[boss.frameIndex];
  if (img.complete) ctx.drawImage(img, boss.x, boss.y, boss.w, boss.h);

  // Barra della vita
  for (const b of enemyBullets) {
  ctx.fillStyle = b.grounded ? '#777' : '#39FF14';  // grigio a terra, verde acceso in volo
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r ?? 4, 0, 2 * Math.PI);
  ctx.fill();
}

  ctx.fillRect(boss.x, boss.y - 10, boss.w * (boss.health / boss.maxHealth), 6);
}

    explosions.forEach(ex=>{ const img=explosionFrames[ex.frame]; if(img.complete) ctx.drawImage(img,ex.x,ex.y,50,50); });
    ctx.fillStyle='#ff0'; player.bullets.forEach(b=>{ ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,2*Math.PI);ctx.fill(); });
    ctx.fillStyle='#39FF14'; enemyBullets.forEach(b=>{ ctx.beginPath();ctx.arc(b.x,b.y,4,0,2*Math.PI);ctx.fill(); });
    ctx.fillStyle='#fff'; ctx.font='16px sans-serif'; ctx.fillText(`Punteggio: ${score}`,W-150,35);
  }

  function loop(time){ const dt=time-lastTime; lastTime=time; if(playing){ elapsedTime+=dt; gameSpeed=baseSpeed+elapsedTime*accelRate; update(dt);} draw(); requestAnimationFrame(loop); }

  loadScores(); lastTime=performance.now(); loop(lastTime);
  
   // ———————— FINE PARTITA ————————
function endGame() {
  playing = false;
  bgMusic.pause();

  finalScore.textContent = `Punteggio finale: ${score}`;
  gameOverScreen.style.display = 'flex';

  const name = prompt('Game Over! Inserisci il tuo nome:') || 'Anonimo';

  // 1. Recupera i punteggi esistenti
  const sc = JSON.parse(localStorage.getItem('scores') || '[]');

  // 2. Aggiungi il nuovo punteggio
  sc.push({ name, score });

  // 3. Salva tutto in localStorage
  localStorage.setItem('scores', JSON.stringify(sc));

  // 4. Aggiorna la classifica a schermo
  loadScores();
}


    // ———————— CARICA CLASSIFICA ————————
function loadScores() {
  const sc = JSON.parse(localStorage.getItem('scores') || '[]');

  // Ordina dal più alto al più basso
  sc.sort((a, b) => b.score - a.score);

  // Mostra solo i primi 5
  scoreList.innerHTML = '';
  sc.slice(0, 5).forEach((s, idx) => {
    const li = document.createElement('li');
    li.textContent = `${s.name}: ${s.score}`;
    scoreList.append(li);
  });
}




    // Alla fine dello script, inizializza:
    loadScores();
    lastTime = performance.now();
    loop(lastTime);
</script>
